<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hover Reveal</title>
  <style>
    #content { width: 600px; margin: 0 auto; font-family: Arial, Helvetica, sans-serif; font-size: 2rem; }
    .hide { color: #fff; border-bottom: 1px dotted blue; }
    .hide:hover { color: #f00; cursor: pointer; }
  </style>
</head>
<body>
  <div id="content">
    <h1 class="hide">Hello World!</h1>
    <p>
      Lorem ipsum…
      <span class="hide"> Dignissim enim sit amet venenatis. </span>
      More text <span class="hide">erat</span>.
    </p>
  </div>
</body>
</html>
